name: CI

# Typecheck and run every test, including api/security.test.ts, on each push
# and pull request, so a security fix can't quietly regress.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci installs exactly what package-lock.json pins and runs no
      # lifecycle scripts from dependencies.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
